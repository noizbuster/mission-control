[package]
name = "mission-control-sidecar"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "mission-control-sidecar"
path = "src/main.rs"

[dependencies]
anyhow = "1"
brush-builtins = "0.2"
brush-core = { version = "0.5", default-features = false }
libc = "0.2"
os_pipe = "1"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time", "process"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dev-dependencies]
tempfile = "3"
